<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Abidin Bilingual Boarding School</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #120101;
        line-height: 1.6;
        padding: 30px;
}

/* Header Styles */
header {
        background-color: #81153a;
        color: white;
        text-align: center;
        padding: 25px 20px 15px;
        border-radius: 5px 5px 0 0;
    }

header h1 {
        font-size: 28px;
    }

    header p {
        font-size: 13px;
        margin-top: 3px;
    }

    /*NAVIGATION STYLES*/
nav {
        margin-top:18px;
    }

nav ul {
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 45px;
    }

    nav a {
        color: #f8f5f5;
        text-decoration: none;
        font-size: 14px;
    }

    nav a:hover {
        text-decoration: underline;
    }

    /*SECTION */
    section {
        margin-bottom: 35px;
    }

    section h2 {
        font-size: 20px;
        margin-bottom: 12px;
    }

    .program p {
        font-size: 14px;
    }

    /* ROADMAP */
    .roadmap-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .roadmap article {
        border-left: 3px solid #777;
        padding: 15px;
        min-height: 100px;
        background-color:#fafafa;
    }

    .roadmap h3 {
        font-size: 16px;
        margin-bottom: 8px;
    }

    .roadmap p {
        font-size: 13px;
    }

    /*GALLERY */
    .gallery-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    .gallery figure {
        margin: 0;
        overflow: hidden;
        border-radius: 5px;
    }

    .gallery img:hover {
        transform: scale(1.05);
    }

    
</style>
</html>
